[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spacebyte"
version = "0.1.0"
description = "Official pretrained ByteFormer baseline utilities"
requires-python = ">=3.10"

[project.optional-dependencies]
pixel = ["timm==0.4.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
